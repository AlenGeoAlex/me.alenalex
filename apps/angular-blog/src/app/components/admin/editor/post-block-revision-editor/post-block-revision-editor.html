<div class="w-full h-full py-8 px-10 flex flex-col gap-0 divide-y divide-(--border)">
  <p-table
    [value]="revisionResource.hasValue() ? revisionResource.value()?.revisions ?? [] : []"
    styleClass="w-full table-fixed">
    <ng-template #caption>
      <div class="flex items-center justify-between">
        <span class="text-xl font-bold">Published/Non Published Revision</span>
        <p-button
          severity="secondary"
          icon="pi pi-plus"
          rounded raised (onClick)="createRevision()"
          [loading]="isRevisionCreationLoading()"
          tooltipPosition="bottom"
          pTooltip="Create a new revision from the current saved post block"
        />
      </div>
    </ng-template>
    <ng-template #header>
      <tr>
        <th class="px-4 py-2 w-[20%] text-left">Created At</th>
        <th class="px-4 py-2 w-[5%] text-left">Revision No</th>
        <th class="px-4 py-2 w-[35%] text-left">Blob Key</th>
        <th class="px-4 py-2 w-[20%] text-left">Published At</th>
        <th class="px-4 py-2 w-[20%] text-left">Actions</th>
      </tr>
    </ng-template>
    <ng-template #body let-revision>
      <tr>
        <td class="px-4 py-2">{{revision.createdAt | date:'short'}}</td>
        <td class="px-4 py-2">{{revision.revisionNumber}}</td>
        <td class="px-4 py-2">{{revision.blobKey || 'Not Published'}}</td>
        <td class="px-4 py-2">{{revision.publishedAt | date:'short'}}</td>
        <td class="px-4 py-2 flex flex-row gap-2">
          @if (revision.isPublished){
            <p-button
              severity="secondary"
              icon="pi pi-eye"
              rounded
              raised
              (onClick)="viewRevision(revision)"
              [pTooltip]="'Show revision HTML'"
            />
          } @else {
            <p-button
              severity="secondary"
              icon="pi pi-file-pdf"
              rounded
              raised
              (onClick)="publishRevision(revision)"
              pTooltip="Queue render/re-render of the selected revision"
            />
          }
          <p-button
            severity="secondary"
            icon="pi pi-pencil"
            rounded
            raised
            (onClick)="newRevisionFrom($event, revision)"
            pTooltip="Create a new revision from the selected revision"
          >

          </p-button>
          <p-button
            severity="danger"
            icon="pi pi-trash"
            rounded
            (onClick)="deleteRevision(revision)"
            pTooltip="Delete the selected revision"
          >
          </p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
